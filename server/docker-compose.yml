# Deploy su VPS: server multigiocatore + sito statico, dietro il reverse proxy
# nginx condiviso (container gazette-nginx-1). Il nostro container si aggancia
# alla rete che nginx già usa, così nginx lo raggiunge PER NOME
# (proxy_pass http://vibe-city:8080). Progetto isolato: non tocca gli altri.
#
#   cd /root/vibe-city
#   docker compose up -d --build
name: vibe-city

services:
  server:
    build: .
    image: vibe-city-server:latest
    container_name: vibe-city
    restart: unless-stopped
    environment:
      PORT: "8080"
      STATIC_DIR: /app/public          # i file del gioco (build di dist/, montati sotto)
      MAX_ROOMS: "20"                  # partite simultanee: oltre, i nuovi host vanno in sala d'attesa
      MAX_QUEUE: "30"                  # lunghezza massima della sala d'attesa
      LEADERBOARD_FILE: /app/data/leaderboard.json   # classifica condivisa (sul volume: sopravvive ai deploy)
    volumes:
      - ./public:/app/public:ro
      # Dati di runtime del server. In SCRITTURA e FUORI dall'immagine: il container viene
      # ricostruito a ogni deploy, la classifica no.
      - ./data:/app/data
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  edge:
    external: true
    name: gazette_gazette-net           # la rete su cui vive gazette-nginx-1
