# Vibe City - reverse proxy for the game (WebSocket + static site, same origin).
# Add it to /root/nginx/default.conf of the gazette-nginx-1 container and reload.
# Both vibecity.schengatto.com and the legacy libre-city.schengatto.com are served;
# the legacy host stays until the 301 follow-up replaces it.
# The proxy reaches the "vibe-city" container by name on the shared network.
# The upstream is a VARIABLE (resolved at runtime by the Docker resolver): a reload
# does not fail when the container is briefly down. Requires at the top of
# default.conf:  resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name vibecity.schengatto.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 off;
    server_name vibecity.schengatto.com;

    ssl_certificate     /etc/letsencrypt/live/vibecity.schengatto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vibecity.schengatto.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        set $upstream_vibe vibe-city;
        proxy_pass         http://$upstream_vibe:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;          # WebSocket upgrade
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;                          # long-lived WS connections
    }
}

server {
    listen 80;
    server_name libre-city.schengatto.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 off;
    server_name libre-city.schengatto.com;

    ssl_certificate     /etc/letsencrypt/live/schengatto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schengatto.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        set $upstream_vibe vibe-city;
        proxy_pass         http://$upstream_vibe:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;          # WebSocket upgrade
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;                          # long-lived WS connections
    }
}
